<body>
  <div data-ax-header-mount></div>

    <section class="ax-page-banner ax-surface-dark"><div class="ax-container"><p class="ax-styleguide__label ax-styleguide__label--dark">The role finder</p><h1>Start with the work you want to understand.</h1><p>Browse career-oriented roles and see every programme in the register that trains for each one.</p></div></section>

      <div class="ax-container">
        <div class="ax-compliance-banner"><strong>Career-oriented roles are pathways for exploration, not employment guarantees.</strong><p data-non-guarantee></p></div>

        </div>
      </div>
    </section>
